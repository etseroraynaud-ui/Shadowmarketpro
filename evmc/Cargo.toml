[package]
name = "evmc"
version = "0.1.0"
edition = "2024"
description = "EVMC : moteur de recherche et d'évaluation de prévisions probabilistes multi-horizon"
build = "build.rs"

[lib]
name = "evmc"
path = "src/lib.rs"

[[bin]]
name = "evmc"
path = "src/bin/evmc.rs"

[dependencies]
arrow = { version = "60.0.0", default-features = false }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[profile.release]
opt-level = 3
debug = false
